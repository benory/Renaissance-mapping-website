<script>

//////////////////////////////
//
// DOMContentLoaded event -- fill in the Headers index mappings.
// 

document.addEventListener("DOMContentLoaded", function () {
	let md = MAP.METADATA.Headers;
	let output = MAP.index.Headers;
	for (let i=0; i<md.length; i++) {
		let sheetid = md[i]["Spreadsheet ID"];
		let javaid = md[i]["JavaScript Name"];
		if (!sheetid) {
			continue;
		}
		if (!javaid) {
			continue;
		}
		let id = `${sheetid}:${javaid}`;
		let value = md[i]["Column Name"];
		if (!value) {
			continue;
		}
		if (output[id]) {
			console.warn("Non-unique ID", id, "changing", output[id], "to", value);
		}
		output[id] = value;
	}
});

//////////////////////////////
//
// DOMContentLoaded event -- run after webpage has finished loading.
//

document.addEventListener("DOMContentLoaded", function () {
	buildLookupTables();

	let Opts = {
		name: "map",
		view: [48.25, 7],
		zoom: 5,
		zoomMin: 4,
		zoomMax: 19,
		bounds: [[34, -25], [72, 45]]
	};

	doMapSetup(Opts);

});

//////////////////////////////
//
// checkbox-item input[type="checkbox"] – show markers if box is clicked
//

document.addEventListener('DOMContentLoaded', () => {
    document.querySelector("#composer-select").checked = true;
    document.querySelector("#musician-select").checked = true;
    document.querySelector("#non-musician-select").checked = false;
    document.querySelector("#certainty-select").checked = false;

    document.querySelectorAll('.checkbox-container input[type="checkbox"]').forEach(checkbox => {
        checkbox.addEventListener('change', handleCheckboxChange);
    });

    // Click Event Listener for Clusters to Update Sidebar
	markerCluster.on('clusterclick', function (event) {
		const clusterMarkers = event.layer.getAllChildMarkers();
		updateSidebarWithClusterMarkers(clusterMarkers);
	});

	// Ensure the sidebar updates when clusters spiderfy (expand)
	markerCluster.on('spiderfied', function (event) {
	    const clusterMarkers = event.markers; // Get expanded markers

	    // Update the sidebar with the new visible markers
	    updateSidebarWithClusterMarkers(clusterMarkers);
	});
	
	map.on('moveend zoomend', () => {
	    if (map && map._popup && map.hasLayer(map._popup)) {
	        return;
	    }
	    filterAndSearchMarkers();
	});

	document.addEventListener("click", (e) => {
	    const isClickInsideSearch = e.target.closest(".search-bar");
	    const isClickInsideInstitution = e.target.closest("#institution-popup") || e.target.closest("#institution-button") || e.target.closest(".country-item");

	    if (!isClickInsideSearch) {
	        const results = document.getElementById("autocomplete-results");
	        if (results) results.innerHTML = "";
	    }

	    if (!isClickInsideInstitution) {
	        const popup = document.getElementById("institution-popup");
	        if (popup) popup.remove();
	    }
	});

	document.addEventListener("keydown", (event) => {
	    if (event.key === "Escape" && !document.getElementById("correction-dialog")?.open) {
	        // Close autocomplete
	        const resultsContainer = document.getElementById("autocomplete-results");
	        if (resultsContainer) {
	            resultsContainer.innerHTML = "";
	            resultsContainer.style.display = "none";
	        }

	        const input = document.getElementById("input");
	        if (input) {
	            input.blur(); // Optional
	        }

	        // Close institution popup
	        const popup = document.getElementById("institution-popup");
	        if (popup) popup.remove();
	    }
	});
});

function handleCheckboxChange() {
    // Run filtering logic to determine which markers should be shown
    filterAndSearchMarkers();
    updateSidebar();
}

// Initial call to position the active label correctly on page load
window.onload = function() {
    initTimelineSlider();
    syncTimelineSliderToCurrentDateRange();
    updateSliderBackground();
    filterAndSearchMarkers();

    // Call this function on page load to summon the marker if an eventid is in the URL
	loadMarkerFromURL();
};

document.addEventListener("DOMContentLoaded", () => {
  const btn = document.getElementById("institution-button");
  const dropdown = document.getElementById("institution-dropdown");
  const mapRow = document.getElementById("map").closest(".row");

  function fitInstitutionPopup() {
    const popup = dropdown.querySelector("#institution-popup");
    if (!popup) return;

    const height = mapRow.getBoundingClientRect().bottom - popup.getBoundingClientRect().top - 10;
    popup.style.setProperty("--institution-popup-height", `${Math.max(0, height)}px`);
  }

  const popupResize = new ResizeObserver(fitInstitutionPopup);
  popupResize.observe(mapRow);
  popupResize.observe(dropdown.parentElement);

  btn.addEventListener("click", () => {
    const popup = document.getElementById("institution-popup");
    if (popup) {
      popup.remove();
    } else {
      const popupHTML = `
        <div id="institution-popup" class="institution-popup apple-popup visible">
          <div class="institution-type-toggle" role="radiogroup" aria-label="Institution type">
            <label>
              <input type="radio" name="institution-type" value="ecclesiastical" checked>
              <span>Ecclesiastical</span>
            </label>
            <label>
              <input type="radio" name="institution-type" value="political">
              <span>Political</span>
            </label>
          </div>
          <div class="country-filters" role="group" aria-labelledby="institution-country-label">
            <span class="section-label" id="institution-country-label">Institution in:</span>
          </div>
          <div class="institution-list-container">
            <ul id="institution-list" class="institution-list"></ul>
          </div>
        </div>`;

      dropdown.insertAdjacentHTML("beforeend", popupHTML);
      fitInstitutionPopup();
      updateInstitutionList(); // Rebuild list

      document.querySelectorAll('input[name="institution-type"]').forEach(radio => {
        radio.addEventListener("change", updateInstitutionList);
      });
    }
  });
});

document.addEventListener("DOMContentLoaded", function () {
    const params = new URLSearchParams(window.location.search);
    const target = params.get("select");

    if (target) {
        const input = document.getElementById("input");
        if (input) {
            input.value = target;
        }

        // Trigger your search-selection behavior
        if (typeof selectSearchTarget === "function") {
            selectSearchTarget(target);
        } else if (typeof selectPersonByName === "function") {
            selectPersonByName(target);
        } else if (typeof addSelectedName === "function") {
            addSelectedName(target);
        }

        if (input) {
            input.value = "";
            input.blur();
        }

        // Ensure the pills update
        setTimeout(() => {
            if (typeof updateActiveNamesDisplay === "function") {
                updateActiveNamesDisplay();
            }
        }, 50);
    }
});

document.addEventListener("DOMContentLoaded", () => {
  const toggleBtn = document.getElementById("toggle-histogram-btn");
  const toggleAction = toggleBtn.querySelector(".histogram-toggle-action");
  const mapRow = document.getElementById("map").closest(".row");

  // Refresh again after the map reaches its final animated height.
  mapRow.addEventListener("transitionend", (event) => {
    if (event.target === mapRow && event.propertyName === "height") {
      map.invalidateSize({ animate: false });
    }
  });

  toggleBtn.addEventListener("click", () => {
    const visible = document.body.classList.toggle("histogram-visible");
    toggleAction.textContent = visible ? "Hide" : "Show";
    toggleBtn.setAttribute("aria-expanded", String(visible));
    if (visible) syncTimelineSliderToCurrentDateRange();

    // tell Leaflet immediately to re-measure its container
    map.invalidateSize();
  });
});

document.addEventListener("DOMContentLoaded", () => {
  const btn = document.getElementById("date-button");
  const popup = document.querySelector("#date-dropdown .date-popup");

  const minInput = document.getElementById("date-input-min");
  const maxInput = document.getElementById("date-input-max");

  btn.addEventListener("click", () => {
    const open = popup.classList.toggle("visible");
    btn.setAttribute("aria-expanded", open);
    if (open) {
      const [min, max] = currentDateRange;
      minInput.value = min > availableDateRange.min ? min : "";
      maxInput.value = max < availableDateRange.max ? max : "";
    }
  });

  popup.querySelector(".date-apply").addEventListener("click", () => {
    const HARD_MIN = availableDateRange.min;
    const HARD_MAX = availableDateRange.max;
    let min = parseInt(minInput.value, 10);
    let max = parseInt(maxInput.value, 10);

    // Fallbacks
    if (isNaN(min)) min = HARD_MIN;
    if (isNaN(max)) max = HARD_MAX;

    // Clamp to bounds
    min = Math.max(HARD_MIN, Math.min(HARD_MAX, min));
    max = Math.max(HARD_MIN, Math.min(HARD_MAX, max));

    // Ensure proper ordering
    if (min > max) {
      [min, max] = [max, min];
    }

    // Sync inputs and actual filter range
    minInput.value = min;
    maxInput.value = max;
    currentDateRange = [min, max];
    syncTimelineSliderToCurrentDateRange();
    filterAndSearchMarkers();

    popup.classList.remove("visible");
    btn.setAttribute("aria-expanded", "false");
  });

  popup.querySelector(".date-reset").addEventListener("click", () => {
    const HARD_MIN = availableDateRange.min;
    const HARD_MAX = availableDateRange.max;
    currentDateRange = [HARD_MIN, HARD_MAX];
    syncTimelineSliderToCurrentDateRange();

    minInput.value = "";
    maxInput.value = "";

    filterAndSearchMarkers();

    popup.classList.remove("visible");
    btn.setAttribute("aria-expanded", "false");
  });

  document.addEventListener("click", (e) => {
    if (!document.getElementById("date-dropdown").contains(e.target)) {
      popup.classList.remove("visible");
      btn.setAttribute("aria-expanded", "false");
    }
  });
});

</script>
