<script>

function updateSidebar() {
    sidebarGroups.clear();

    document.getElementById('sidebar-composers-a').innerHTML = '';
    document.getElementById('sidebar-composers-b').innerHTML = '';
    document.getElementById('sidebar-composers-other').innerHTML = '';
    document.getElementById('sidebar-musicians').innerHTML = '';
    document.getElementById('sidebar-nonmusicians').innerHTML = '';

    const checkboxStates = getCheckboxStates();
    const minYear = currentDateRange[0];
    const maxYear = currentDateRange[1];

    const activeNames = new Set([
        ...getActiveNamesFromContainer('composer-active'),
        ...getActiveNamesFromContainer('musician-active'),
        ...getActiveNamesFromContainer('non-musician-active')
    ]);
    const activeLocationIds = getActiveLocationIds();
    const useMapBounds = activeLocationIds.length === 0;

    forceExpand = activeNames.size > 0 || activeLocationIds.length > 0;

    const searchInput = document.querySelector("#input");
    const searchContext = getSearchContext(searchInput ? searchInput.value : "");

    const visibleMarkers = getVisibleMarkers(useMapBounds).filter(entry => {
        const { locationid, locationname, locationparent, alias,
            earliestyear, latestyear, text, locationprocessed } = entry;
        let show = !!getMarkerDisplayPerson(entry, activeNames, checkboxStates);

        if (show && activeLocationIds.length > 0 && !markerMatchesSelectedLocation({ locationid, locationname, locationparent })) show = false;

        if (show && !markerMatchesSearch({ text, locationprocessed, alias, earliestyear, latestyear }, searchContext)) {
            show = false;
        }

        const range = getNormalizedYearRange(earliestyear, latestyear);
        if (show && (!range || range.start > maxYear || range.end < minYear)) show = false;

        return show;
    }).map(entry => ({ ...entry, ...getMarkerDisplayPerson(entry, activeNames, checkboxStates) }));

    const uniquePeople = new Set(
        visibleMarkers.map(m => m.personprocessed)
    );

    useBuckets = uniquePeople.size > 1;

    // Chronological sort (earliest → latest)
    visibleMarkers.sort((a, b) => {
        const ay = Number(a.earliestyear) || 0;
        const by = Number(b.earliestyear) || 0;
        if (ay !== by) return ay - by;

        const am = Number(a.earliestmonth) || 0;
        const bm = Number(b.earliestmonth) || 0;
        if (am !== bm) return am - bm;

        const ad = Number(a.earliestday) || 0;
        const bd = Number(b.earliestday) || 0;
        return ad - bd;
    });

    // Populate sidebar
    visibleMarkers.forEach(markerData => {
        updateMarkerSidebar(markerData, true, markerData.eventid);
    });
}

function getHighlightColorForPerson(name) {
    const allSelected = Array.from(selectedNames);
    const index = allSelected.indexOf(name);

    if (index === -1) return null; // no highlight color

    return getColorForIndex(index);
}

function updateMarkerSidebar(markerData, show, eventid) {
    if (!show) return;

    const displayPerson = getMarkerDisplayPerson(markerData, selectedNames, getCheckboxStates());
    if (!displayPerson) return;
    markerData = { ...markerData, ...displayPerson };
    const { personID, personprocessed, targetType } = markerData;
    const type = personID.substring(0, 3);

    let container;

    if (type === "BCO") {
        if (targetType === "A") {
            container = document.getElementById("sidebar-composers-a");
        } else if (targetType === "B") {
            container = document.getElementById("sidebar-composers-b");
        } else {
            container = document.getElementById("sidebar-composers-other");
        }
    } else if (type === "BMU") {
        container = document.getElementById("sidebar-musicians");
    } else {
        container = document.getElementById("sidebar-nonmusicians");
    }

    // If only one person, skip buckets entirely
    if (!useBuckets) {
        updateMarkerSidebarRow(markerData, container, eventid);
        return;
    }

    // --- CREATE PERSON BUCKET IF NEEDED ---
    if (!sidebarGroups.has(personprocessed)) {
        const headerRow = document.createElement("tr");
        const headerCell = document.createElement("td");
        headerCell.className = "sidebar-person";

        headerCell.style.setProperty("--sidebar-row-color", getSidebarColor(personID, personprocessed));

        const caret = document.createElement("span");
        caret.className = "sidebar-caret";
        caret.setAttribute("aria-hidden", "true");

        const nameSpan = document.createElement("span");
        nameSpan.className = "sidebar-name";
        nameSpan.textContent = personprocessed;

        const countSpan = document.createElement("span");
        countSpan.className = "sidebar-count";
        countSpan.textContent = " (0 events)";

        headerCell.appendChild(nameSpan);
        headerCell.appendChild(countSpan);
        headerCell.appendChild(caret);
        headerRow.appendChild(headerCell);

        const body = document.createElement("tbody");
        body.className = "sidebar-events";

        headerCell.addEventListener("click", () => {
            caret.classList.toggle("open");
            body.classList.toggle("open");
        });

        // AUTO-EXPAND if names are selected
        if (forceExpand) {
            caret.classList.add("open");
            body.classList.add("open");
        }

        // LOGIC FOR COMPOSERS
        if (type === "BCO") {
            const priority = { "A": 0, "B": 1 };
            const myRank = priority[targetType] ?? 2;

            let inserted = false;
            const rows = Array.from(container.children);

            for (let i = 0; i < rows.length; i++) {
                const row = rows[i];
                const existingName = row.querySelector(".sidebar-name")?.textContent;
                if (!existingName) continue;

                const existingGroup = sidebarGroups.get(existingName);
                if (!existingGroup) continue;

                const existingRank =
                    priority[existingGroup.targetType] ?? 2;

                if (existingRank > myRank) {
                    container.insertBefore(headerRow, row);
                    container.insertBefore(body, row);
                    inserted = true;
                    break;
                }
            }

            if (!inserted) {
                container.appendChild(headerRow);
                container.appendChild(body);
            }
        } else {
            // musicians / non-musicians: keep current behavior
            container.appendChild(headerRow);
            container.appendChild(body);
        }

        sidebarGroups.set(personprocessed, {
            body,
            countSpan,
            targetType
        });
    }

    const groupBody = sidebarGroups.get(personprocessed).body;
    updateMarkerSidebarRow(markerData, groupBody, eventid);
}

function formatSidebarDate(dateRange) {
    const months = /\b(?:January|February|March|April|June|July|August|September|October|November|December)\b/g;
    return dateRange.trim().replace(/\s+/g, ' ')
        .replace(months, month => month.slice(0, 3))
        // Keep the shared month and year at the end of a same-month range.
        .replace(/^(\d{1,2}) ([A-Z][a-z]{2}) (\d{4}) to (\d{1,2}) \2 \3(\?*)$/, '$1–$4 $2 $3$5')
        // Keep the shared year at the end, unless the start has its own uncertainty marks.
        .replace(/^(.+?) (\d{4}) to (?=.+ \2\?*$)/, '$1–')
        .replace(/ to /g, '–');
}

function updateMarkerSidebarRow(
    { personID, personprocessed, locationprocessed, daterange, description, recordType, fixedMarkerStyle },
    tableBody,
    eventid
) {
    const sanitizedEventId = sanitizeEventId(eventid);
    if (tableBody.querySelector(`#marker-${sanitizedEventId}`)) return;

    const row = document.createElement('tr');
    row.id = `marker-${sanitizedEventId}`;

    row.className = 'sidebar-event-row';
    row.style.setProperty('--sidebar-row-color', fixedMarkerStyle?.fillColor ?? getSidebarColor(personID, personprocessed));

    const cell = document.createElement('td');
    const grouped = tableBody.classList.contains('sidebar-events');
    const onlySelectedPerson = selectedNames.size === 1 && selectedNames.has(personprocessed);
    const title = [recordType === 'Benefice' ? 'Benefice' : '', grouped || onlySelectedPerson ? '' : personprocessed]
        .filter(Boolean).join(' · ');

    if (title) {
        const name = document.createElement('strong');
        name.className = 'sidebar-event-title';
        name.textContent = title;
        cell.appendChild(name);
    }

    if (locationprocessed || daterange) {
        const details = document.createElement('div');
        details.className = 'sidebar-event-details';
        if (locationprocessed) {
            const place = document.createElement('strong');
            place.textContent = locationprocessed;
            details.appendChild(place);
        }
        if (daterange) {
            const date = document.createElement('span');
            date.className = 'sidebar-event-date';
            const compactDate = formatSidebarDate(daterange);
            date.textContent = (locationprocessed ? ' · ' : '') + compactDate;
            if (compactDate !== daterange) date.title = daterange;
            details.appendChild(date);
        }
        cell.appendChild(details);
    }

    if (description) {
        const summary = document.createElement('div');
        summary.className = 'sidebar-event-description';
        summary.textContent = description.slice(0, 100) + (description.length > 100 ? '...' : '');
        cell.appendChild(summary);
    }

    row.appendChild(cell);

    row.addEventListener('click', () => {
        const marker = markers.find(m => m.eventid === eventid)?.marker;
        if (!marker) return;

        const sidebarToggle = document.getElementById('toggle-sidebar-btn');
        if (sidebarToggle.getAttribute('aria-expanded') === 'true' &&
            getComputedStyle(sidebarToggle).display !== 'none') {
            sidebarToggle.click();
        }
        marker.openPopup();
    });

    tableBody.appendChild(row);

    // Update event count in the header
    const group = sidebarGroups.get(personprocessed);
    if (group && group.countSpan) {
        const key = recordType === "Benefice" ? "benefices" : "events";
        group.countSpan.dataset[key] = Number(group.countSpan.dataset[key] || 0) + 1;
        const events = Number(group.countSpan.dataset.events || 0);
        const benefices = Number(group.countSpan.dataset.benefices || 0);
        group.countSpan.textContent = ` (${events} event${events === 1 ? "" : "s"}` +
            (benefices ? `, ${benefices} benefice${benefices === 1 ? "" : "s"}` : "") + ")";
    }
}

// Update Sidebar with Cluster Points
function updateSidebarWithClusterMarkers(clusterMarkers) {
    // Clear existing sidebar entries
    document.getElementById('sidebar-composers').innerHTML = '';
    document.getElementById('sidebar-musicians').innerHTML = '';
    document.getElementById('sidebar-nonmusicians').innerHTML = '';

    clusterMarkers.forEach(marker => {
        // Find the corresponding data entry
        const markerData = markers.find(m => m.marker === marker);

        if (markerData) {
            updateMarkerSidebar(markerData, true, markerData.eventid);
        }
    });
}

// Function to handle sharing the point
function sharePoint(eventid) {
    const shareURL = `${window.location.origin}/?eventid=${eventid}`;
    
    // Remove the "EV:" prefix if it exists
    if (eventid.startsWith('EV:')) {
        eventid = eventid.slice(3); // Remove the first three characters
    }

    navigator.clipboard.writeText(shareURL);
}

</script>
