<script>

function getNonMusicianCategory(personID) {
    const person = findInfo(personID, 'Bio_Nonmusicians');
    return person?.[MAP.cindex('BNO', 'BNOBRCAT')]?.trim() || 'Other people';
}

function matchesNonMusicianCategory(person, checkboxStates) {
    return !person.personID.startsWith('BNO:') ||
        !checkboxStates.nonMusicianCategories ||
        checkboxStates.nonMusicianCategories.has(getNonMusicianCategory(person.personID));
}

function enableAllNonMusicianCategories() {
    const parent = document.getElementById('non-musician-select');
    parent.checked = true;
    parent.indeterminate = false;
    document.querySelectorAll('#non-musician-categories input').forEach(input => {
        input.checked = true;
    });
}

function initNonMusicianCategories() {
    const parent = document.getElementById('non-musician-select');
    const toggle = document.getElementById('non-musician-categories-toggle');
    const container = document.getElementById('non-musician-categories');
    const field = MAP.cindex('BNO', 'BNOBRCAT');
    const order = ['Rulers', 'Nobility', 'Church leaders', 'Clergy & chapel staff',
        'Diplomats, courtiers & officials', 'Arts, letters & music trades', 'Other people'];
    const icons = {
        'Rulers': '<path d="m3 6 4 4 5-7 5 7 4-4-2 12H5Z"/><path d="M5 21h14"/>',
        'Nobility': '<path d="m12 3 8 3v6c0 4-4 7-8 9-4-2-8-5-8-9V6Z"/><path d="M12 7v10M8 12h8"/>',
        'Church leaders': '<path d="M12 2C9 5 6 9 6 13v4h12v-4c0-4-3-8-6-11ZM6 17l-2 5m14-5 2 5M12 6v8m-3-4h6"/>',
        'Clergy & chapel staff': '<path d="M12 2v6M9 5h6M5 13l7-5 7 5v8H5ZM3 21h18M10 21v-6h4v6"/>',
        'Diplomats, courtiers & officials': '<path d="M7 4h11a3 3 0 0 1 3 3v2h-6V7a3 3 0 0 1 6 0M7 4a3 3 0 0 0-3 3v13l3-2 3 2 3-2 2 2V9M7 9h4M7 13h4"/>',
        'Arts, letters & music trades': '<path d="M20 3C12 2 6 8 6 16l4 1C18 14 21 8 20 3ZM3 21 16 8M8 14l5-1"/>',
        'Other people': '<circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 4v3"/>'
    };
    const categories = [...new Set(MAP.METADATA.Bio_Nonmusicians
        .map(person => person[field]?.trim() || 'Other people'))];
    categories.sort((a, b) => {
        const rank = category => order.includes(category) ? order.indexOf(category) : order.length;
        return rank(a) - rank(b) || a.localeCompare(b);
    });

    categories.forEach(category => {
        const label = document.createElement('label');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.value = category;
        checkbox.checked = parent.checked;
        const icon = document.createElement('span');
        icon.className = 'non-musician-category-icon';
        icon.setAttribute('aria-hidden', 'true');
        icon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
            focusable="false">${icons[category] || icons['Other people']}</svg>`;
        const text = document.createElement('span');
        text.textContent = category;
        label.append(checkbox, icon, text);
        container.appendChild(label);
        checkbox.addEventListener('change', () => {
            const selected = container.querySelectorAll('input:checked').length;
            parent.checked = selected > 0;
            parent.indeterminate = selected > 0 && selected < categories.length;
        });
    });

    parent.addEventListener('change', () => {
        parent.indeterminate = false;
        container.querySelectorAll('input').forEach(input => { input.checked = parent.checked; });
    });

    toggle.addEventListener('click', () => {
        container.hidden = !container.hidden;
        toggle.setAttribute('aria-expanded', String(!container.hidden));
    });
}

</script>
