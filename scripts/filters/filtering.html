<script>

// Filter markers + user search
function filterAndSearchMarkers(skipSidebarUpdate = false) {
    if (typeof temporaryBenefices !== "undefined") temporaryBenefices.expire();
    const input = document.querySelector("#input");
    const searchContext = getSearchContext(input ? input.value : "");

    const checkboxStates = getCheckboxStates();
    const histogramEndYear = TIMELINE_END_YEAR - 10;
    const histogramCounts = initializeDecades(HISTOGRAM_START_YEAR, histogramEndYear);
    const minYear = currentDateRange[0];
    const maxYear = currentDateRange[1];
    
    const activeNames = new Set([
        ...getActiveNamesFromContainer('composer-active'),
        ...getActiveNamesFromContainer('musician-active'),
        ...getActiveNamesFromContainer('non-musician-active')
    ]);
    const activeLocationIds = getActiveLocationIds();
    const useMapBounds = activeLocationIds.length === 0;

    const visibleMarkers = getVisibleMarkers(useMapBounds);
    const currentMarkers = new Set(markerCluster.getLayers());
    const newVisibleMarkers = new Set();
    const markersToRemove = new Set();

    let searchCount = 0;
    let beneficeCount = 0;

    if (!skipSidebarUpdate) {
        document.querySelector('#active-markers-table tbody').innerHTML = '';
    }

    visibleMarkers.forEach(entry => {
        const { marker, alias, locationid, locationname, locationparent,
            earliestyear, latestyear, text, eventid, locationprocessed } = entry;
        const displayPerson = getMarkerDisplayPerson(entry, activeNames, checkboxStates);
        const personprocessed = displayPerson?.personprocessed;
        const type = displayPerson?.personID.substring(0, 3);
        let show = !!displayPerson;

        if (show && activeLocationIds.length > 0 && !markerMatchesSelectedLocation({ locationid, locationname, locationparent })) {
            show = false;
        }

        if (show && !markerMatchesSearch({ text, locationprocessed, alias, earliestyear, latestyear }, searchContext)) {
            show = false;
        }

        const range = getNormalizedYearRange(earliestyear, latestyear);

        if (show && !range) {
            show = false;
        }

        if (show && (range.start > maxYear || range.end < minYear)) {
            show = false;
        }

        // Update marker display
        updateMarkerOnMap(marker, show);

        if (show) {
            searchCount++;
            if (entry.recordType === "Benefice") beneficeCount++;
            newVisibleMarkers.add(marker);
            
            // Update histogram counts
            const clampedEarliest = Math.max(HISTOGRAM_START_YEAR, range.start);
            const clampedLatest = Math.max(
                HISTOGRAM_START_YEAR,
                Math.min(availableDateRange.max, range.end)
            );
            getDecades(clampedEarliest, clampedLatest).forEach(decade => {
                const bin = histogramCounts[decade];
                if (!bin) return;

                bin.total++;

                if (activeNames.size > 0) {
                    bin.highlights[personprocessed] =
                        (bin.highlights[personprocessed] || 0) + 1;
                } else {
                    if (type === "BCO") bin.BCO++;
                    else if (type === "BMU") bin.BMU++;
                    else if (type === "BNO") bin.BNO++;
                }
            });

            if (!skipSidebarUpdate) {
                updateMarkerSidebar(entry, true, eventid);
            }
        } else {
            markersToRemove.add(marker);
        }
    });

    // Properly Remove Hidden Markers From Clusters
    markersToRemove.forEach(marker => {
        if (currentMarkers.has(marker)) {
            markerCluster.removeLayer(marker);
        }
    });

    // Only Add Markers That Are Visible
    newVisibleMarkers.forEach(marker => {
        if (!currentMarkers.has(marker)) {
            markerCluster.addLayer(marker);
        }
    });

    if (!skipSidebarUpdate) {
        updateSidebar();
    }

    const eventCount = searchCount - beneficeCount;
    document.querySelector("#search-count").innerHTML = `${eventCount} ${eventCount === 1 ? "Event" : "Events"}` +
        (beneficeCount ? `, ${beneficeCount} ${beneficeCount === 1 ? "Benefice" : "Benefices"}` : "") + " ";
    
    updateHistogram(histogramCounts);
    map.addLayer(markerCluster);
}

</script>
