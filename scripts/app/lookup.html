<script>

//////////////////////////////
//
// MAP.cindex -- uses the Spreadsheet ID and JavaScript ID to call the full name of a given header
// 

MAP.cindex = function (sheetid, javaid) {
	return this.index.Headers[`${sheetid}:${javaid}`];
}

//////////////////////////////
//
// buildLookupTables –- 
//

function buildLookupTables() {
    const identifiers = {
        Archival_Docs: ["ARD", "ARDID"],
        Bibliography: ["BIB", "BIBID"],
        Bio_Composers: ["BCO", "BCOID"],
        Bio_Musicians: ["BMU", "BMUID"],
        Bio_Nonmusicians: ["BNO", "BNOID"],
        Doc_Entries: ["DOE", "DOEID"],
        Institutions: ["INS", "INSID"],
        Locations: ["LOC", "LOCID"],
        Occasions: ["OCC", "OCCID"]
    };
    for (const [sheet, [sheetId, shortName]] of Object.entries(identifiers)) {
        buildLookupTable(sheet, MAP.cindex(sheetId, shortName));
    }
}


//////////////////////////////
//
// buildLookupTable –-
//

function buildLookupTable(sheet, idKey) {
    const sheetArray = MAP.METADATA[sheet];
    if (!sheetArray || !Array.isArray(sheetArray)){
        console.warn("No METADATA FOR", sheet);
        return;
    }
    if (!idKey) {
        console.warn(`No ID key found for sheet ${sheet}`);
        return;
    }

    const lookup = MAP.lookup[sheet] = {};
    for (let entry of sheetArray) {
        let id = entry[idKey];
        if (!id){
            console.warn("NO ID FOR ENTRY", entry);
            continue;
        }
        lookup[id] = entry;
    }
}

//////////////////////////////
//
// findInfo –- find info on other sheets
//

function findInfo(id, sheet) {
    return MAP.lookup[sheet] ? MAP.lookup[sheet][id] : null;
}

</script>
